<!doctype html>
<html lang="en" class="dark">

    <meta charset="UTF-8" />

      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="color-scheme" content="dark" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wavelength" />

    <meta property="og:site_name" content="Wavelength" />
    <meta property="og:title" content="Wavelength" />

    />
    <meta property="og:url" content="https://wavelength.lgtm.page/" />

    <meta property="og:image:height" content="630" />

      property="og:image:alt"

    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wavelength" />

      name="twitter:description"
      content="Read your friends' minds. A party game for your phones: free, no app."
    />
    <meta name="twitter:image" content="https://wavelength.lgtm.page/og.png" />
